name: Test Suite

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mobile linting
        run: npm run lint:mobile

      - name: Run web linting
        run: npm run lint:web

      - name: Generate Next.js types
        run: npx --workspace=@vineme/web next typegen

      - name: Run type checking
        run: npm run typecheck

      - name: Run mobile type checking gate
        run: node scripts/typecheck-mobile-gate.mjs

      - name: Run CI script unit tests
        run: node --test scripts/classify-pr-risk.test.mjs scripts/check-migration-compat.test.mjs

      - name: Build VitePress docs (when docs changed)
        run: |
          set -euo pipefail
          SHOULD_BUILD=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHOULD_BUILD=true
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1 || true
            fi
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null || echo "docs/fallback")"
            if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(docs/|README\.md$|CONTRIBUTING\.md$|supabase/README\.md$|apps/web/README\.md$|apps/web/docs/|apps/web/app/dashboard/DESIGN\.md$|apps/mobile/src/theme/[^/]+\.md$|apps/mobile/src/components/(ui|referrals)/README\.md$|package\.json$|package-lock\.json$)'; then
              SHOULD_BUILD=true
            fi
          fi

          if [[ "$SHOULD_BUILD" == "true" ]]; then
            npm run docs:build
          else
            echo "No docs files changed; skipping npm run docs:build."
          fi

      - name: Run mobile unit tests
        run: npm run test:unit

      - name: Run mobile integration tests
        run: npm run test:integration

      - name: Run mobile e2e tests
        run: npm run test:e2e

      - name: Build Next.js web app
        run: npm run build:web

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            apps/mobile/coverage/
            apps/mobile/junit.xml
