name: Test Suite

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mobile linting
        run: npm run lint:mobile

      - name: Run web linting
        run: npm run lint:web

      - name: Generate Next.js types
        run: npx --workspace=@vineme/web next typegen

      - name: Run type checking
        run: npm run typecheck

      - name: Run mobile type checking gate
        run: node scripts/typecheck-mobile-gate.mjs

      - name: Run mobile unit tests
        run: npm run test:unit

      - name: Run mobile integration tests
        run: npm run test:integration

      - name: Run mobile e2e tests
        run: npm run test:e2e

      - name: Build Next.js web app
        run: npm run build:web

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            apps/mobile/coverage/
            apps/mobile/junit.xml
