project_id = "vineme2"

[analytics]
enabled = false

[auth]
enable_signup = true

[auth.sms]
enable_signup = true

[auth.sms.twilio]
enabled = true
account_sid = "fake_sid"
message_service_sid = "fake_service_sid"
auth_token = "fake_token"

[auth.sms.test_otp]
# Map fake phone numbers to fixed OTPs
"447712345678" = "123456"
"447712345679" = "123456"

[functions.create-referred-user]
enabled = true
entrypoint = "./functions/create-referred-user/index.ts"
import_map = "./functions/create-referred-user/deno.json"

[functions.delete-auth-user]
enabled = true
entrypoint = "./functions/delete-auth-user/index.ts"
import_map = "./functions/delete-auth-user/deno.json"

[functions.notify-missing-service]
enabled = true
entrypoint = "./functions/notify-missing-service/index.ts"
import_map = "./functions/notify-missing-service/deno.json"

[functions.push-notify-2]
enabled = true
entrypoint = "./functions/push-notify/index.ts"
import_map = "./functions/push-notify/deno.json"

[functions.get-churchsuite-sites]
enabled = true
verify_jwt = true
entrypoint = "./functions/get-churchsuite-sites/index.ts"
import_map = "./functions/get-churchsuite-sites/deno.json"

[functions.create-churchsuite-contact]
enabled = true
# Called only by the Postgres trigger (see
# supabase/migrations/20260812221500_churchsuite_contact_sync_trigger.sql), not by any
# authenticated frontend user, so it verifies its own shared secret instead of a user JWT.
verify_jwt = false
entrypoint = "./functions/create-churchsuite-contact/index.ts"
import_map = "./functions/create-churchsuite-contact/deno.json"

[functions.list-churchsuite-vineme-contacts]
enabled = true
entrypoint = "./functions/list-churchsuite-vineme-contacts/index.ts"
import_map = "./functions/list-churchsuite-vineme-contacts/deno.json"

[functions.mark-user-vulnerable]
enabled = true
verify_jwt = true
entrypoint = "./functions/mark-user-vulnerable/index.ts"
import_map = "./functions/mark-user-vulnerable/deno.json"

[functions.sync-churchsuite-vulnerable-tags]
enabled = true
# Called by both the app (church admin session JWT) and the daily cron job (shared
# webhook secret, not a JWT - see the function's own header comment), so JWT
# verification happens inside the function instead of at the gateway.
verify_jwt = false
entrypoint = "./functions/sync-churchsuite-vulnerable-tags/index.ts"
import_map = "./functions/sync-churchsuite-vulnerable-tags/deno.json"

[functions.group-leader-reminder-notifications]
enabled = true
# Called by the cron job in
# supabase/migrations/20261010120000_schedule_group_leader_reminder_notifications.sql
# with the project's secret API key via the apikey header (withSupabase's own
# "publishable"/"secret" auth modes - see the function's source), not a user JWT, so
# gateway-level JWT verification is disabled here too.
verify_jwt = false
entrypoint = "./functions/group-leader-reminder-notifications/index.ts"
import_map = "./functions/group-leader-reminder-notifications/deno.json"
